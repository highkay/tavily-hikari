name: Fork Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish GHCR image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install PWA asset dependencies
        run: python3 -m pip install --user Pillow

      - name: Compute version
        id: ver
        run: |
          set -euo pipefail
          sha7="$(git rev-parse --short=7 HEAD)"
          version="0.0.0-fork.$(date -u +%Y%m%d).${sha7}"
          echo "sha7=${sha7}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build web assets
        working-directory: web
        env:
          VITE_APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            APP_EFFECTIVE_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ghcr.io/highkay/tavily-hikari:latest
            ghcr.io/highkay/tavily-hikari:sha-${{ steps.ver.outputs.sha7 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Fork Release"
            echo "- version: \`${{ steps.ver.outputs.version }}\`"
            echo "- image: \`ghcr.io/highkay/tavily-hikari:latest\`"
            echo "- immutable tag: \`sha-${{ steps.ver.outputs.sha7 }}\`"
            echo "- deploy (LAN NAS): \`cd /vol1/1000/docker/tavily-hikari && docker compose pull && docker compose up -d\`"
          } >> "${GITHUB_STEP_SUMMARY}"
