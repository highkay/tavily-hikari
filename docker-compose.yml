services:
  tavily-hikari:
    image: ghcr.io/ivanli-cn/tavily-hikari:latest
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      PROXY_BIND: 0.0.0.0
      PROXY_PORT: 8787
      PROXY_DB_PATH: /srv/app/data/tavily_proxy.db
      WEB_STATIC_DIR: /srv/app/web
      # Optional additional providers. Uncomment together with matching keys:
      # SERPAPI_API_KEYS:
      # EXA_API_KEYS:
      # BRAVE_API_KEYS:
      # Provider upstreams (TAVILY/SERPAPI/EXA/BRAVE_UPSTREAM) default per README;
      # override only when routing through a reverse proxy.
    ports:
      - "8787:8787"
    volumes:
      - tavily-hikari-data:/srv/app/data

volumes:
  tavily-hikari-data:
    driver: local
